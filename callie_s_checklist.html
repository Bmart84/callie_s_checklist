<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callie's Checklist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fce7f3, #c7d2fe, #fbcfe8);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #333;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 3D Button Styles */
        .task-btn {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .task-btn:not(.completed):active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 0px 0 0 rgba(0,0,0,0.2) !important;
        }

        .completed-btn {
            background-color: #22c55e !important; /* Green */
            border-color: #166534 !important;
            box-shadow: 0 0px 0 0 rgba(0,0,0,0.2) !important;
            transform: translateY(4px);
            cursor: default;
            opacity: 0.8;
        }

        /* Container Fade Out */
        .fade-out {
            animation: fadeOut 0.6s cubic-bezier(0.5, 0, 0.2, 1) forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); visibility: hidden; }
        }

        /* Kitty Dance Animations */
        .dancing-kitty-wrapper {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hello-kitty {
            position: relative;
            width: 250px;
            height: 200px;
            background-color: white;
            border-radius: 50% 50% 45% 45%;
            border: 8px solid black;
            animation: dance 0.8s infinite alternate ease-in-out;
            margin: 40px auto;
            transform-origin: bottom center;
            box-shadow: 0 20px 25px rgba(0,0,0,0.2);
        }
        
        .hk-ear {
            position: absolute;
            top: -25px;
            width: 70px;
            height: 70px;
            background-color: white;
            border: 8px solid black;
            z-index: -1;
        }
        .hk-ear.left {
            left: -5px;
            border-radius: 10px 100% 10px 10px;
            transform: rotate(-25deg);
        }
        .hk-ear.right {
            right: -5px;
            border-radius: 100% 10px 10px 10px;
            transform: rotate(25deg);
        }
        .hk-eye {
            position: absolute;
            top: 100px;
            width: 20px;
            height: 32px;
            background-color: black;
            border-radius: 50%;
        }
        .hk-eye.left { left: 45px; }
        .hk-eye.right { right: 45px; }
        .hk-nose {
            position: absolute;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 20px;
            background-color: #fde047;
            border: 4px solid black;
            border-radius: 50%;
        }
        .hk-whisker {
            position: absolute;
            width: 50px;
            height: 6px;
            background-color: black;
            border-radius: 3px;
        }
        .hk-whisker.l1 { top: 95px; left: -25px; transform: rotate(10deg); }
        .hk-whisker.l2 { top: 115px; left: -30px; }
        .hk-whisker.l3 { top: 135px; left: -25px; transform: rotate(-10deg); }
        .hk-whisker.r1 { top: 95px; right: -25px; transform: rotate(-10deg); }
        .hk-whisker.r2 { top: 115px; right: -30px; }
        .hk-whisker.r3 { top: 135px; right: -25px; transform: rotate(10deg); }
        .hk-bow {
            position: absolute;
            top: -15px;
            right: 10px;
            z-index: 10;
        }
        .hk-bow-center {
            position: absolute;
            top: 15px;
            left: 20px;
            width: 30px;
            height: 30px;
            background-color: #ef4444;
            border: 6px solid black;
            border-radius: 50%;
            z-index: 2;
        }
        .hk-bow-loop {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: #ef4444;
            border: 6px solid black;
            border-radius: 50%;
        }
        .hk-bow-loop.left { top: 8px; left: -12px; }
        .hk-bow-loop.right { top: 8px; left: 35px; }

        @keyframes dance {
            0% { transform: translateY(0) rotate(-15deg) scale(1); }
            100% { transform: translateY(-40px) rotate(15deg) scale(1.1); }
        }

        .music-note {
            position: absolute;
            font-size: 4rem;
            animation: floatUp 2s infinite linear;
            opacity: 0;
        }

        .note-1 { left: 10%; animation-delay: 0s; }
        .note-2 { right: 10%; animation-delay: 0.5s; }
        .note-3 { left: 25%; animation-delay: 1s; }
        .note-4 { right: 25%; animation-delay: 1.5s; }

        @keyframes floatUp {
            0% { transform: translateY(50px) scale(0.8) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-150px) scale(1.2) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body class="p-6">

    <!-- Checklist Container -->
    <div id="checklist-container" class="w-full max-w-lg bg-white/60 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border-4 border-white">
        <h1 class="text-5xl font-black text-center mb-2 text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500 drop-shadow-sm">
            Callie's List!
        </h1>
        <p class="text-center text-xl text-purple-700 font-bold mb-8">
            Click every item to see a surprise! ✨
        </p>

        <!-- Task Buttons -->
        <div class="flex flex-col gap-4">
            <button class="task-btn bg-pink-400 text-white font-bold py-5 px-6 rounded-2xl border-b-4 border-pink-600 shadow-[0_4px_0_0_#be185d] text-2xl text-left flex items-center justify-between">
                <span class="task-text">Get dressed</span>
                <span class="text-3xl icon">👕</span>
            </button>

            <button class="task-btn bg-purple-400 text-white font-bold py-5 px-6 rounded-2xl border-b-4 border-purple-600 shadow-[0_4px_0_0_#7e22ce] text-2xl text-left flex items-center justify-between">
                <span class="task-text">Eat breakfast</span>
                <span class="text-3xl icon">🥞</span>
            </button>

            <button class="task-btn bg-blue-400 text-white font-bold py-5 px-6 rounded-2xl border-b-4 border-blue-600 shadow-[0_4px_0_0_#1d4ed8] text-2xl text-left flex items-center justify-between">
                <span class="task-text">Fill water bottle</span>
                <span class="text-3xl icon">💧</span>
            </button>

            <button class="task-btn bg-orange-400 text-white font-bold py-5 px-6 rounded-2xl border-b-4 border-orange-600 shadow-[0_4px_0_0_#ea580c] text-2xl text-left flex items-center justify-between">
                <span class="task-text">Brush teeth</span>
                <span class="text-3xl icon">🪥</span>
            </button>

            <button class="task-btn bg-yellow-400 text-white font-bold py-5 px-6 rounded-2xl border-b-4 border-yellow-600 shadow-[0_4px_0_0_#ca8a04] text-2xl text-left flex items-center justify-between">
                <span class="task-text">Pack backpack</span>
                <span class="text-3xl icon">🎒</span>
            </button>
        </div>
    </div>

    <!-- Celebration Kitty Container (Hidden by default) -->
    <div id="kitty-container" class="dancing-kitty-wrapper absolute inset-0 w-full h-full z-50 bg-gradient-to-tr from-fuchsia-200 to-cyan-200">
        <!-- Floating Music Notes -->
        <div class="music-note note-1">🎵</div>
        <div class="music-note note-2">🎶</div>
        <div class="music-note note-3">🎼</div>
        <div class="music-note note-4">🎵</div>

        <h2 class="text-6xl md:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 mb-8 animate-bounce text-center drop-shadow-md">
            YAY CALLIE!
        </h2>
        
        <div class="hello-kitty">
            <div class="hk-ear left"></div>
            <div class="hk-ear right"></div>
            <div class="hk-eye left"></div>
            <div class="hk-eye right"></div>
            <div class="hk-nose"></div>
            <div class="hk-whisker l1"></div>
            <div class="hk-whisker l2"></div>
            <div class="hk-whisker l3"></div>
            <div class="hk-whisker r1"></div>
            <div class="hk-whisker r2"></div>
            <div class="hk-whisker r3"></div>
            <div class="hk-bow">
                <div class="hk-bow-loop left"></div>
                <div class="hk-bow-loop right"></div>
                <div class="hk-bow-center"></div>
            </div>
        </div>

        <button onclick="location.reload()" class="mt-16 bg-white text-purple-600 font-black py-4 px-10 rounded-full text-2xl hover:bg-gray-100 transition-colors shadow-xl border-4 border-purple-200">
            Play Again! 🔄
        </button>
    </div>

    <script>
        // Web Audio API function to play a happy tune
        function playHappySong() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return; 
            const ctx = new AudioContext();
            
            // A longer, more interesting upbeat 8-bit style melody
            const melody = [
                // Part 1: Bouncy climb
                { note: 392.00, time: 0, dur: 0.15 },    // G4
                { note: 523.25, time: 0.2, dur: 0.15 },  // C5
                { note: 659.25, time: 0.4, dur: 0.15 },  // E5
                { note: 783.99, time: 0.6, dur: 0.3 },   // G5
                { note: 659.25, time: 1.0, dur: 0.15 },  // E5
                { note: 783.99, time: 1.2, dur: 0.4 },   // G5

                // Part 2: Quick descent
                { note: 698.46, time: 1.8, dur: 0.15 },  // F5
                { note: 659.25, time: 2.0, dur: 0.15 },  // E5
                { note: 587.33, time: 2.2, dur: 0.15 },  // D5
                { note: 523.25, time: 2.4, dur: 0.3 },   // C5
                
                // Part 3: Little flourish to finish
                { note: 392.00, time: 2.8, dur: 0.15 },  // G4
                { note: 440.00, time: 3.0, dur: 0.15 },  // A4
                { note: 493.88, time: 3.2, dur: 0.15 },  // B4
                { note: 523.25, time: 3.4, dur: 0.2 },   // C5
                { note: 659.25, time: 3.7, dur: 0.2 },   // E5
                { note: 1046.50, time: 4.0, dur: 0.6 }   // C6 (Tada!)
            ];

            melody.forEach(item => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                // 'square' gives a more classic 8-bit retro game feel
                osc.type = 'square'; 
                osc.frequency.value = item.note;
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(ctx.currentTime + item.time);
                
                // Envelope for plucky/staccato 8-bit notes
                gain.gain.setValueAtTime(0, ctx.currentTime + item.time);
                // Quick attack (lower volume for square waves so it isn't too loud)
                gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + item.time + 0.02); 
                // Decay based on the note's specific duration
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + item.time + item.dur); 
                
                osc.stop(ctx.currentTime + item.time + item.dur + 0.1);
            });
        }

        // Web Audio API function for a quick, cool checkmark double-ding
        function playCheckSound() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return; 
            const ctx = new AudioContext();
            
            const playTone = (freq, time, dur) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine'; // A smooth, clear tone
                osc.frequency.value = freq;
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.start(ctx.currentTime + time);
                gain.gain.setValueAtTime(0, ctx.currentTime + time);
                gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + time + 0.02); // quick fade in
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + time + dur); // fade out
                osc.stop(ctx.currentTime + time + dur + 0.1);
            };
            
            playTone(880.00, 0, 0.1);       // First ding (A5)
            playTone(1108.73, 0.1, 0.15);   // Second higher ding (C#6)
        }

        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.task-btn');
            const checklistContainer = document.getElementById('checklist-container');
            const kittyContainer = document.getElementById('kitty-container');
            
            let completedCount = 0;
            const totalTasks = buttons.length;

            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // Ignore if already clicked
                    if (this.classList.contains('completed')) return;

                    // Play the custom checkmark sound
                    playCheckSound();

                    // 1. Mark as completed visually
                    this.classList.add('completed', 'completed-btn');
                    
                    // Add a strike-through and change the icon to a checkmark
                    const textSpan = this.querySelector('.task-text');
                    const iconSpan = this.querySelector('.icon');
                    
                    textSpan.innerHTML = `<del class="opacity-75">${textSpan.innerText}</del>`;
                    iconSpan.innerText = '✅';

                    // 2. Increase Count
                    completedCount++;

                    // 3. Check if all tasks are done
                    if (completedCount === totalTasks) {
                        // Wait half a second so the user sees the last checkmark
                        setTimeout(() => {
                            // Fade out the list
                            checklistContainer.classList.add('fade-out');
                            
                            // Wait for the fade out to almost finish, then show the kitty
                            setTimeout(() => {
                                checklistContainer.style.display = 'none'; // Completely remove from layout
                                kittyContainer.style.display = 'flex'; // Show the dancing kitty
                                playHappySong(); // Play the cheerful tune!
                            }, 500); 

                        }, 600); 
                    }
                });
            });
        });
    </script>
</body>
</html>
